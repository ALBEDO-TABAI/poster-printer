<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App icon: the favicon's printer (28-unit grid, src: poster-printer/public/favicon.svg) on a macOS tile -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfc"/>
      <stop offset="1" stop-color="#e3e3e8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b31"/>
      <stop offset="1" stop-color="#0b0b0e"/>
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation=".5"/>
      <feOffset dy=".45" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#tileShadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#0b0b0e" stroke-opacity=".07"/>
  <g transform="translate(204 196) scale(22)">
    <rect x="1.5" y="2" width="25" height="16" rx="5.5" fill="url(#body)" filter="url(#soft)"/>
    <rect x="6.5" y="9.4" width="15" height="1.6" rx=".8" fill="#f2f2f4"/>
    <rect x="8" y="11.6" width="12" height="15" rx="1.4" fill="#f7f7f8" stroke="#0b0b0e" stroke-width="1.05" filter="url(#soft)"/>
    <rect x="10" y="14" width="5" height="3.2" fill="#ff5a1f"/>
    <path d="M10 19.6h8M10 22h5.5" stroke="#0b0b0e" stroke-width="1.1" stroke-linecap="round" opacity=".55"/>
    <circle cx="22" cy="5.6" r="1.35" fill="#ff5a1f"/>
  </g>
</svg>
